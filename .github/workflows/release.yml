name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify tag version
        shell: pwsh
        run: |
          $version = python -c "from app import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match application version v$version"
          }
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build-release.ps1 -Version $version
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/scrcpy-gui-${{ github.ref_name }}-windows-x64.zip
            build/scrcpy-gui-${{ github.ref_name }}-windows-x64.zip.sha256
