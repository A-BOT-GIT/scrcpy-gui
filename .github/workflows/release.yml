name: Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify tag version
        shell: pwsh
        run: |
          $version = python -c "from app import __version__; print(__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match application version v$version"
          }
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Build release package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/build-release.ps1 -Version $version
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = "build/scrcpy-gui-${{ github.ref_name }}-windows-x64.zip"
          $checksum = "$archive.sha256"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Release archive was not created: $archive"
          }
          if (-not (Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw "Release checksum was not created: $checksum"
          }
          gh release create "${{ github.ref_name }}" $archive $checksum `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --notes-file RELEASE_NOTES.md `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assetCount = gh release view "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --json assets --jq ".assets | length"
          if ($assetCount -ne 2) {
            throw "Expected 2 release assets, found $assetCount"
          }
